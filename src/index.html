<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JSON Auto-Flow Visualizer</title>
  <style>
    :root {
      --bg: #e5e7eb;
      --node-bg: #ffffff;
      --node-border: #d1d5db;
      --accent: #2563eb;
      --key-color: #7c3aed;
      --string-color: #059669;
      --number-color: #d97706;
      --muted: #64748b;
      --line-color: #94a3b8;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
      background: var(--bg);
    }

    .app {
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
    }

    .canvas-wrap:active {
      cursor: grabbing;
    }

    .workspace {
      position: absolute;
      width: 9000px;
      height: 6000px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      transform-origin: 0 0;
    }

    .workspace::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    .node {
      position: absolute;
      min-width: 220px;
      background: var(--node-bg);
      border: 1px solid var(--node-border);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      font-size: 13px;
      z-index: 10;
    }

    .node .header {
      padding: 10px 14px;
      background: #f8fafc;
      border-bottom: 1px solid var(--node-border);
      border-radius: 12px 12px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .node .title {
      font-weight: 700;
      color: #1e293b;
      text-transform: uppercase;
      font-size: 10px;
    }

    .collapse-btn {
      border: none;
      background: #e2e8f0;
      border-radius: 4px;
      cursor: pointer;
      color: var(--muted);
      padding: 2px 8px;
      font-size: 10px;
    }

    .node-body {
      padding: 12px;
    }

    .node-body.collapsed {
      display: none;
    }

    .data-row {
      display: flex;
      font-family: ui-monospace, monospace;
      margin-bottom: 4px;
      white-space: nowrap;
    }

    .data-key {
      color: var(--key-color);
      font-weight: 600;
      margin-right: 8px;
    }

    .data-key::after {
      content: ":";
      color: #94a3b8;
    }

    .data-value.string {
      color: var(--string-color);
    }

    .data-value.number {
      color: var(--number-color);
    }

    .data-value.ref {
      color: var(--accent);
      font-style: italic;
      font-weight: bold;
    }

    svg#connections {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
    }

    path.connector {
      fill: none;
      stroke: var(--line-color);
      stroke-width: 2px;
    }

    .port {
      fill: white;
      stroke: var(--line-color);
      stroke-width: 2px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="canvas-wrap" id="canvas-container">
      <div class="workspace" id="workspace">
        <svg id="connections"></svg>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const container = document.getElementById("canvas-container");
      const workspace = document.getElementById("workspace");
      const svg = document.getElementById("connections");

      const W_SIZE = 3000;
      const state = { x: 0, y: 0, scale: 0.8 };
      const connectionList = [];

      function applyTransform() {
        const rect = container.getBoundingClientRect();
        const scaledSize = W_SIZE * state.scale;
        const minX = rect.width - scaledSize;
        const minY = rect.height - scaledSize;
        state.x = Math.min(0, Math.max(minX, state.x));
        state.y = Math.min(0, Math.max(minY, state.y));
        workspace.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
        updatePaths();
      }

      function updatePaths() { connectionList.forEach(fn => fn()); }

      function createNode(title, x, y, data) {
        const node = document.createElement("div");
        node.className = "node";
        node.style.left = x + "px";
        node.style.top = y + "px";

        node.innerHTML = `
          <div class="header">
            <div class="title">${title}</div>
            <button class="collapse-btn">−</button>
          </div>
          <div class="node-body"></div>
        `;

        const body = node.querySelector(".node-body");
        Object.entries(data).forEach(([k, v]) => {
          const row = document.createElement("div");
          row.className = "data-row";
          let valContent = v;
          let type = typeof v;

          if (v && typeof v === 'object') {
            valContent = Array.isArray(v) ? `Array(${v.length})` : "Object";
            type = "ref";
          }

          row.innerHTML = `<span class="data-key">${k}</span><span class="data-value ${type}">${valContent}</span>`;
          body.appendChild(row);
        });

        node.querySelector(".collapse-btn").onclick = (e) => {
          body.classList.toggle("collapsed");
          e.target.textContent = body.classList.contains("collapsed") ? "+" : "−";
          requestAnimationFrame(updatePaths);
        };

        workspace.appendChild(node);
        return node;
      }

      function connect(a, b) {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", "connector");
        const sC = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        const eC = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        [sC, eC].forEach(c => { c.setAttribute("r", "3"); c.setAttribute("class", "port"); svg.appendChild(c); });
        svg.appendChild(path);

        function update() {
          const x1 = a.offsetLeft + a.offsetWidth;
          const y1 = a.offsetTop + 20;
          const x2 = b.offsetLeft;
          const y2 = b.offsetTop + 20;
          const cp = Math.max(Math.abs(x2 - x1) * 0.5, 40);
          path.setAttribute("d", `M ${x1} ${y1} C ${x1 + cp} ${y1}, ${x2 - cp} ${y2}, ${x2} ${y2}`);
          sC.setAttribute("cx", x1); sC.setAttribute("cy", y1);
          eC.setAttribute("cx", x2); eC.setAttribute("cy", y2);
        }
        connectionList.push(update);
        update();
      }

      /* --- Recursive Visualization Logic --- */
      function visualize(data) {
        // Clear previous
        workspace.querySelectorAll('.node').forEach(n => n.remove());
        svg.innerHTML = '';
        connectionList.length = 0;

        let offsetX = 100;
        let offsetY = 100;
        const columnWidth = 350;
        const rowHeight = 180;

        function walk(obj, label, x, y) {
          // Filter out primitive values for the node content, only show them inside the node
          const primitives = {};
          const complexes = [];

          Object.entries(obj).forEach(([k, v]) => {
            if (v && typeof v === 'object') {
              complexes.push({ key: k, val: v });
            }
            primitives[k] = v;
          });

          const currentNode = createNode(label, x, y, primitives);

          complexes.forEach((item, index) => {
            const nextX = x + columnWidth;
            const nextY = y + (index * rowHeight);
            const childNode = walk(item.val, item.key, nextX, nextY);
            connect(currentNode, childNode);
          });

          return currentNode;
        }

        // Center start
        walk(data, "Root", (W_SIZE / 2) - 500, (W_SIZE / 2) - 200);
        applyTransform();
      }

      /* --- Interaction --- */
      let isDragging = false, lastPos = { x: 0, y: 0 };
      container.onpointerdown = (e) => {
        if (e.target.closest('.collapse-btn') || e.target.closest('.node')) return;
        isDragging = true;
        lastPos = { x: e.clientX, y: e.clientY };
        container.setPointerCapture(e.pointerId);
      };
      container.onpointermove = (e) => {
        if (!isDragging) return;
        state.x += e.clientX - lastPos.x;
        state.y += e.clientY - lastPos.y;
        lastPos = { x: e.clientX, y: e.clientY };
        applyTransform();
      };
      container.onpointerup = () => isDragging = false;
      container.onwheel = (e) => {
        if (!e.ctrlKey) return;
        e.preventDefault();
        state.scale = Math.min(2, Math.max(0.2, state.scale * (e.deltaY < 0 ? 1.05 : 0.95)));
        applyTransform();
      };

      // Example: Complex Nested Data
      const myComplexData = {
        }

      visualize(myComplexData);

      // Center the whole workspace initially
      const rect = container.getBoundingClientRect();
      state.x = (rect.width / 2) - (W_SIZE / 2 * state.scale);
      state.y = (rect.height / 2) - (W_SIZE / 2 * state.scale);
      applyTransform();

    })();
  </script>
</body>

</html>
